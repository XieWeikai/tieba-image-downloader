[package]
name = "tieba-image-downloader"
version = "0.4.0"
edition = "2024"
description = "High performance, resumable Baidu Tieba original image downloader"
license = "MIT"
repository = "https://github.com/XieWeikai/tieba-image-downloader"
homepage = "https://github.com/XieWeikai/tieba-image-downloader"
documentation = "https://docs.rs/tieba-image-downloader"
readme = "README.md"
keywords = ["tieba", "downloader", "images", "cli", "macos"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
futures-util = "0.3"
indicatif = "0.17"
mime = "0.3"
rand = "0.9"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "http2", "json", "stream", "rustls-tls"], default-features = false }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokio-tungstenite = "0.27"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
