name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Validate agent plugin files
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool plugins/tieba-image-downloader/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/tieba-image-downloader/.claude-plugin/plugin.json >/dev/null
          sh -n plugins/tieba-image-downloader/skills/download-tieba-images/scripts/run.sh
      - name: Check version synchronization
        run: ./scripts/check-version-sync.sh

  macos:
    name: macOS build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Run tests
        run: cargo test --all-targets --locked
